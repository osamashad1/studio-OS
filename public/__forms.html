<!DOCTYPE html>
<!-- Static copy of the project form so Netlify Forms can detect it at deploy time.
     Field names must match src/components/form/ProjectForm.tsx. Not shown to visitors. -->
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Form</title>
  </head>
  <body>
    <form name="project" data-netlify="true" netlify-honeypot="website" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="business" />
      <input type="text" name="needs" />
      <input type="text" name="budget" />
      <input type="text" name="start" />
      <textarea name="message"></textarea>
      <input type="text" name="privacy" />
      <input type="text" name="language" />
      <input type="text" name="website" />
    </form>
  </body>
</html>
